<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="920" viewBox="0 0 1700 920">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/></marker>
<style>.title{font:bold 30px Arial;fill:#172554}.sub{font:17px Arial;fill:#475569}.pool{fill:#fff;stroke:#64748b;stroke-width:2}.lane{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.task{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.ev{fill:#fff;stroke:#15803d;stroke-width:4}.gw{fill:#fef3c7;stroke:#b45309;stroke-width:2}.t{font:15px Arial;fill:#172554;text-anchor:middle}.label{font:bold 16px Arial;fill:#334155}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#a)}.msg{fill:none;stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#m)}.note{font:14px Arial;fill:#6d28d9}</style></defs>
<rect width="1700" height="920" fill="#f8fafc"/><text x="45" y="52" class="title">BPMN — Matrícula de aluno em uma faculdade</text><text x="47" y="82" class="sub">Processo acadêmico com conferência de documentos, decisão, atividades paralelas e comunicação com pagamento.</text>
<rect class="pool" x="45" y="110" width="1610" height="490" rx="8"/><rect class="lane" x="90" y="110" width="1565" height="230"/><rect class="lane" x="90" y="340" width="1565" height="260"/><rect x="45" y="110" width="45" height="490" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="68" y="355" transform="rotate(-90 68 355)" class="label" text-anchor="middle">Faculdade</text><text x="108" y="137" class="label">Raia 1 — Aluno</text><text x="108" y="367" class="label">Raia 2 — Secretaria acadêmica</text>
<circle class="ev" cx="145" cy="235" r="21"/><text x="145" y="275" class="t">Início: pedido</text><text x="145" y="293" class="t">recebido</text><rect class="task" x="195" y="202" width="145" height="66" rx="10"/><text x="267" y="228" class="t"><tspan x="267">Preencher</tspan><tspan x="267" dy="18">formulário</tspan></text><rect class="task" x="405" y="402" width="145" height="66" rx="10"/><text x="477" y="428" class="t"><tspan x="477">Conferir</tspan><tspan x="477" dy="18">documentos</tspan></text><polygon class="gw" points="610,402 642,435 610,468 578,435"/><text x="610" y="490" class="t">Documentos</text><text x="610" y="508" class="t">completos?</text><rect class="task" x="490" y="225" width="145" height="66" rx="10"/><text x="562" y="251" class="t"><tspan x="562">Corrigir dados</tspan><tspan x="562" dy="18">ou documentos</tspan></text><rect class="task" x="735" y="202" width="150" height="66" rx="10"/><text x="810" y="228" class="t"><tspan x="810">Selecionar curso</tspan><tspan x="810" dy="18">e turma</tspan></text>
