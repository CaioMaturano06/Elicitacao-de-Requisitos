<rect x="45" y="855" width="1610" height="45" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="65" y="882" class="sub">Inclui início e fim, tarefas, piscina com duas raias, gateway exclusivo, gateway paralelo e mensagens entre piscinas.</text></svg>